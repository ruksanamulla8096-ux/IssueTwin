{% extends "base.html" %}
{% block title %}Login · IssueTwin{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
  <h2 class="fw-bold">Welcome back</h2><p class="text-secondary">Sign in to your organization's IssueTwin workspace.</p>
  <form method="post">
    <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
    <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <hr><p class="small text-secondary mb-1">Demo administrator</p>
  <code>admin@issuetwin.demo</code><br><code>Admin123!</code>
</div>
{% endblock %}
